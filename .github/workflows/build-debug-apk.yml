name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: ['odin-**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the NDK and platform this project asks for
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleNonRoot_gameDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-apk
          path: app/build/outputs/apk/**/*.apk
